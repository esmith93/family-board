<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16202B; --ink-2:#1E2B39; --ink-3:#27374A; --ink-4:#33455B;
  --paper:#F2EDE4; --dim:#8194A6;
  --amber:#E9A23B; --sage:#7FA98C; --late:#C4553D;
  --pad:18px; --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--ink);color:var(--paper);
  font-family:"IBM Plex Sans",system-ui,sans-serif;
  overscroll-behavior-y:contain;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
input{font:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px;border-radius:4px}

/* header */
.top{display:flex;align-items:baseline;justify-content:space-between;padding:22px var(--pad) 14px}
.day{font-family:"Zilla Slab",serif;font-weight:600;font-size:30px;letter-spacing:-.01em}
.date{font-family:"Zilla Slab",serif;font-weight:500;font-size:15px;color:var(--dim);margin-left:9px}
.count{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--dim);
  letter-spacing:.08em;opacity:0;transition:opacity .2s}
.count.on{opacity:1}

/* tabs */
.segs{display:flex;gap:6px;padding:0 var(--pad) 18px}
.seg{
  flex:1;padding:11px 6px;border-radius:10px;background:var(--ink-2);
  font-size:13px;font-weight:500;color:var(--dim);text-align:center;
  transition:background .16s,color .16s;
}
.seg[aria-selected="true"]{background:var(--paper);color:var(--ink);font-weight:600}

/* list */
.list{padding:0 var(--pad) 130px}
.who{
  display:flex;align-items:baseline;gap:9px;
  margin:20px 2px 9px;
}
.who:first-child{margin-top:0}
.who h2{font-family:"Zilla Slab",serif;font-weight:600;font-size:17px;margin:0}
.who span{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--dim)}
.who i{flex:1;height:1px;background:var(--ink-3)}

.row{
  position:relative;overflow:hidden;border-radius:var(--r);
  background:var(--ink-2);margin-bottom:8px;max-height:120px;
  transition:opacity .3s,transform .3s,margin .3s,max-height .3s;
}
.row.gone{opacity:0;transform:scale(.96);max-height:0;margin-bottom:0}
.fill{position:absolute;inset:0;width:0;background:var(--sage);pointer-events:none}
.slide{position:relative;display:flex;align-items:center;gap:14px;padding:15px 16px;will-change:transform}
.mark{
  flex:0 0 26px;height:26px;border-radius:50%;
  border:2px solid var(--ink-4);position:relative;transition:border-color .16s;
}
.mark::after{
  content:"";position:absolute;inset:4px;border-radius:50%;
  background:var(--sage);transform:scale(0);transition:transform .2s;
}
.row.done .mark{border-color:var(--sage)}
.row.done .mark::after{transform:scale(1)}
.body{flex:1;min-width:0}
.text{font-size:16px;line-height:1.32;position:relative;display:inline}
.text::after{
  content:"";position:absolute;left:0;top:52%;height:1.5px;width:0;
  background:currentColor;transition:width .26s ease-out;
}
.row.done .text{color:var(--dim)}
.row.done .text::after{width:100%}
.meta{
  font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--dim);
  margin-top:5px;letter-spacing:.05em;
}
.meta.overdue{color:var(--late)}
.meta.today{color:var(--amber)}
.row.late{border-left:3px solid var(--late)}

/* empty */
.empty{padding:64px 24px;text-align:center}
.empty h2{font-family:"Zilla Slab",serif;font-weight:500;font-size:20px;margin:0 0 6px}
.empty p{font-size:14px;color:var(--dim);margin:0}

/* add bar */
.addbar{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  transition:opacity .2s;
  padding:12px var(--pad);
  padding-bottom:calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(transparent,var(--ink) 34%);
}
.addrow{display:flex;gap:9px}
.addbar.away{opacity:0;pointer-events:none}
.add{flex:1;padding:16px;border-radius:var(--r);background:var(--paper);color:var(--ink);font-weight:600;font-size:15px}
.add:active{transform:translateY(1px)}
.cam{
  flex:0 0 56px;border-radius:var(--r);background:var(--ink-2);
  border:1px solid var(--ink-3);display:grid;place-items:center;
}
.cam:active{transform:translateY(1px)}
.cam svg{width:23px;height:23px;stroke:var(--paper);stroke-width:1.7;fill:none;
  stroke-linecap:round;stroke-linejoin:round}
.cam.busy{background:var(--amber);border-color:var(--amber)}
.cam.busy svg{stroke:var(--ink)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(8,13,19,.72);opacity:0;pointer-events:none;transition:opacity .22s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:88vh;overflow-y:auto;
  background:var(--ink-2);border-radius:22px 22px 0 0;
  padding:24px var(--pad) calc(24px + env(safe-area-inset-bottom));
  transform:translateY(105%);transition:transform .28s cubic-bezier(.32,.72,0,1);
}
.sheet.on{transform:none}
.sheet h2{font-family:"Zilla Slab",serif;font-weight:600;font-size:21px;margin:0 0 18px}
.sheet label{
  display:block;font-family:"IBM Plex Mono",monospace;font-size:11px;
  color:var(--dim);letter-spacing:.08em;margin:0 0 8px;
}
.sheet input{
  width:100%;padding:15px;border-radius:11px;border:1px solid var(--ink-3);
  background:var(--ink);color:var(--paper);font-size:16px;margin-bottom:18px;
}
.sheet input::placeholder{color:var(--dim)}
.pick{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:18px}
.opt{
  padding:9px 14px;border-radius:999px;font-size:13px;font-weight:500;
  border:1px solid var(--ink-3);color:var(--dim);
  transition:background .14s,border-color .14s,color .14s;
}
.opt[aria-pressed="true"]{background:var(--amber);border-color:var(--amber);color:var(--ink);font-weight:600}
.opt.day{padding:9px 0;flex:1 0 13%;text-align:center;font-family:"IBM Plex Mono",monospace;font-size:11px}
.acts{display:flex;gap:10px}
.acts button{flex:1;padding:15px;border-radius:11px;font-weight:600;font-size:15px}
.cancel{background:var(--ink-3);color:var(--paper)}
.save{background:var(--amber);color:var(--ink)}

/* snackbar */
.snack{
  position:absolute;left:var(--pad);right:var(--pad);
  bottom:100%;margin-bottom:10px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 18px;border-radius:12px;background:var(--paper);color:var(--ink);
  transform:translateY(14px);opacity:0;pointer-events:none;
  transition:transform .26s cubic-bezier(.32,.72,0,1),opacity .18s;
  box-shadow:0 8px 28px rgba(0,0,0,.4);
}
.snack.on{transform:none;opacity:1;pointer-events:auto}
.snack span{font-size:14px;font-weight:500}
.snack button{font-weight:600;font-size:14px;color:#A8641A;padding:4px}
.snack.bad{background:var(--late);color:#fff}
.snack.bad button{color:#fff}

@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms !important}}
</style>
</head>
<body>

<header class="top">
  <div><span class="day" id="day"></span><span class="date" id="date"></span></div>
  <div class="count" id="status"></div>
</header>

<div class="segs" id="segs" role="tablist"></div>
<main id="main" class="list"></main>

<div class="addbar" id="addbar">
  <div class="snack" id="snack" role="status">
  <span id="snackText"></span>
  <button id="snackBtn">Undo</button>
</div>
  <div class="addrow">
    <button class="add" id="addBtn">Add something</button>
    <button class="cam" id="camBtn" aria-label="Send a photo to the wall">
      <svg viewBox="0 0 24 24"><path d="M3 8.5A1.5 1.5 0 0 1 4.5 7h2.2l1.1-2h8.4l1.1 2h2.2A1.5 1.5 0 0 1 21 8.5v9A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5z"/><circle cx="12" cy="13" r="3.4"/></svg>
    </button>
  </div>
</div>
<input type="file" id="photoInput" accept="image/*" multiple hidden>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <h2 id="sheetTitle"></h2>

  <label>WHAT KIND</label>
  <div class="pick" id="pickType"></div>

  <input id="newText" placeholder="What needs doing?" autocomplete="off">

  <label>WHO</label>
  <div class="pick" id="pickWho"></div>

  <div id="whenBlock">
    <label id="whenLabel"></label>
    <div class="pick" id="pickWhen"></div>
    <input type="date" id="newDate" style="display:none">
  </div>

  <div id="noteBlock" style="display:none">
    <label>NOTE — OPTIONAL</label>
    <input id="newNote" placeholder="Anything worth remembering" autocomplete="off">
  </div>

  <div class="acts">
    <button class="cancel" id="cancelBtn">Cancel</button>
    <button class="save" id="saveBtn">Add it</button>
  </div>
</section>


<script>
var S = { lists:[], people:[] };
var tab = 0, lastAction = null, snackTimer = null;
var LIVE = (typeof google !== 'undefined' && google.script && google.script.run);
var $ = function(id){ return document.getElementById(id); };
var buzz = function(ms){ if (navigator.vibrate) navigator.vibrate(ms); };
var listName = function(){ return S.lists[tab] ? S.lists[tab].name : ''; };
var isChores = function(){ return listName() === 'Chores'; };

/* ── boot ── */
(function(){
  var d = new Date();
  $('day').textContent  = d.toLocaleDateString(undefined,{weekday:'long'});
  $('date').textContent = d.toLocaleDateString(undefined,{month:'short',day:'numeric'});
  load();
})();

function load(){
  if (!LIVE){ status('NO CONNECTION'); return; }
  google.script.run
    .withSuccessHandler(function(st){ S = st; status(''); render(); })
    .withFailureHandler(function(){
      status('OFFLINE');
      toast("Couldn't reach the sheet. Pull down to retry.", null, true);
    })
    .getState();
}

/* ── render ── */
function render(){
  var segs = $('segs'); segs.innerHTML = '';
  S.lists.forEach(function(l,i){
    var b = document.createElement('button');
    b.className = 'seg';
    b.textContent = l.name === 'Todo' ? 'To-do' : l.name;
    b.setAttribute('role','tab');
    b.setAttribute('aria-selected', i===tab ? 'true':'false');
    b.onclick = function(){ tab = i; buzz(8); render(); };
    segs.appendChild(b);
  });
  renderMain();
}

function open_(){
  var l = S.lists[tab];
  return l ? l.items.filter(function(i){ return !i.done; }) : [];
}

function status(msg){
  var el = $('status');
  el.textContent = msg || '';
  el.classList.toggle('on', !!msg);
}

function renderMain(){
  var main = $('main'); main.innerHTML = '';
  var items = open_();

  if (!items.length){
    main.innerHTML = '<div class="empty"><h2>' +
      (isChores() ? "Today's chores are done." : 'Nothing on the list.') +
      '</h2><p>' +
      (isChores() ? 'New ones appear tomorrow.' : 'Add something when it comes up.') +
      '</p></div>';
    return;
  }

  var current = null, group = null;
  items.forEach(function(it){
    if (it.who !== current){
      current = it.who;
      var n = items.filter(function(x){ return x.who === current; }).length;
      var h = document.createElement('div');
      h.className = 'who';
      h.innerHTML = '<h2></h2><i></i><span>' + n + '</span>';
      h.querySelector('h2').textContent = current;
      main.appendChild(h);
    }
    main.appendChild(row(it));
  });
}

/* ── row + swipe ── */
function row(it){
  var el = document.createElement('div');
  el.className = 'row' + (it.state === 'overdue' ? ' late' : '');
  el.innerHTML =
    '<div class="fill"></div><div class="slide">' +
    '<button class="mark" aria-label="Mark done"></button>' +
    '<div class="body"><span class="text"></span>' +
    ((it.due || it.note) ? '<div class="meta"></div>' : '') + '</div></div>';

  el.querySelector('.text').textContent = it.text;
  var meta = el.querySelector('.meta');
  if (meta){
    meta.textContent = it.note ? (it.due + '  ·  ' + it.note) : it.due;
    if (it.state === 'overdue' || it.state === 'today') meta.className = 'meta ' + it.state;
  }

  var slide = el.querySelector('.slide'), fill = el.querySelector('.fill');
  el.querySelector('.mark').onclick = function(){ complete(el, it); };

  var x0=0, dx=0, live=false, LIMIT=130, TRIP=78;
  slide.addEventListener('touchstart', function(e){
    x0 = e.touches[0].clientX; dx = 0; live = true; slide.style.transition='none';
  }, {passive:true});
  slide.addEventListener('touchmove', function(e){
    if(!live) return;
    dx = Math.max(0, Math.min(LIMIT, e.touches[0].clientX - x0));
    slide.style.transform = 'translateX('+dx+'px)';
    fill.style.width = (dx/LIMIT*100)+'%';
    if (dx>TRIP && !slide.dataset.t){ slide.dataset.t='1'; buzz(10); }
    if (dx<TRIP) delete slide.dataset.t;
  }, {passive:true});
  slide.addEventListener('touchend', function(){
    live = false;
    slide.style.transition = 'transform .24s cubic-bezier(.32,.72,0,1)';
    fill.style.transition = 'width .24s';
    if (dx > TRIP) complete(el, it);
    else { slide.style.transform=''; fill.style.width='0'; }
  });
  return el;
}

/* ── complete / undo ── */
function complete(el, it){
  var list = listName();
  buzz(18);
  el.classList.add('done');
  el.querySelector('.fill').style.width = '100%';

  setTimeout(function(){
    el.classList.add('gone');
    setTimeout(function(){ it.done = true; renderMain(); }, 300);
  }, 320);

  google.script.run
    .withFailureHandler(function(){
      it.done = false; renderMain();
      toast("Couldn't save that. Check your connection.", null, true);
    })
    .setDone(list, it.id, true);

  lastAction = { list:list, item:it };
  toast('Done', undo);
}

function undo(){
  if (!lastAction) return;
  var a = lastAction; lastAction = null;
  a.item.done = false;
  buzz(10); renderMain(); hideToast();
  google.script.run
    .withFailureHandler(function(){
      a.item.done = true; renderMain();
      toast("Couldn't undo that.", null, true);
    })
    .setDone(a.list, a.item.id, false);
}

/* ── add ── */
var pWho = null, pWhen = null, pDays = [], pType = 'Todo';
var addingChores = function(){ return pType === 'Chores'; };
var DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var FULL = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

$('addBtn').onclick = function(){
  $('newText').value = '';
  pWho = null;

  var w = $('pickWho'); w.innerHTML = '';
  S.people.forEach(function(p){
    w.appendChild(opt(p, function(){
      pWho = (pWho === p) ? null : p;
      syncGroup(w, function(x){ return x === pWho; });
    }, false));
  });

  var t = $('pickType'); t.innerHTML = '';
  [['To-do','Todo'], ['Chore','Chores']].forEach(function(pair){
    t.appendChild(opt(pair[0], function(){ setType(pair[1]); }, false));
  });
  setType(isChores() ? 'Chores' : 'Todo');

  $('addbar').classList.add('away');
  $('scrim').classList.add('on');
  $('sheet').classList.add('on');
  setTimeout(function(){ $('newText').focus(); }, 260);
};

/** Switch the sheet between a one-off task and a recurring chore. */
function setType(kind){
  pType = kind;
  pWhen = null; pDays = [];
  $('newDate').value = '';
  $('newDate').style.display = 'none';

  syncGroup($('pickType'), function(label){
    return label === (addingChores() ? 'Chore' : 'To-do');
  });

  $('sheetTitle').textContent  = addingChores() ? 'Add a chore' : 'Add a to-do';
  $('newText').placeholder     = addingChores() ? 'Which chore?' : 'What needs doing?';
  $('whenLabel').textContent   = addingChores() ? 'HOW OFTEN' : 'WHEN';
  $('noteBlock').style.display = addingChores() ? 'block' : 'none';
  $('newNote').value = '';
  buildWhen();
}

function opt(label, fn, isDay){
  var b = document.createElement('button');
  b.className = 'opt' + (isDay ? ' day' : '');
  b.textContent = label;
  b.setAttribute('aria-pressed','false');
  b.onclick = function(){ buzz(6); fn(b); };
  return b;
}

function syncGroup(box, isOn){
  Array.prototype.forEach.call(box.children, function(c){
    c.setAttribute('aria-pressed', isOn(c.textContent) ? 'true' : 'false');
  });
}

function buildWhen(){
  var box = $('pickWhen'); box.innerHTML = '';

  if (addingChores()){
    ['Daily','Weekdays','Weekends'].forEach(function(p){
      box.appendChild(opt(p, function(){
        pWhen = (pWhen === p) ? null : p; pDays = [];
        syncGroup(box, function(t){ return t === pWhen; });
      }, false));
    });
    DAYS.forEach(function(d,i){
      box.appendChild(opt(d, function(){
        pWhen = null;
        var k = pDays.indexOf(FULL[i]);
        if (k > -1) pDays.splice(k,1); else pDays.push(FULL[i]);
        syncGroup(box, function(t){
          if (t === pWhen) return true;
          var j = DAYS.indexOf(t);
          return j > -1 && pDays.indexOf(FULL[j]) > -1;
        });
      }, true));
    });
    return;
  }

  var opts = [
    ['Today',    0],
    ['Tomorrow', 1],
    ['This week',null],
    ['Pick…',   'pick']
  ];
  opts.forEach(function(o){
    box.appendChild(opt(o[0], function(){
      pWhen = (pWhen === o[0]) ? null : o[0];
      $('newDate').style.display = (pWhen === 'Pick…') ? 'block' : 'none';
      syncGroup(box, function(t){ return t === pWhen; });
    }, false));
  });
}

function closeSheet(){
  $('scrim').classList.remove('on');
  $('sheet').classList.remove('on');
  $('addbar').classList.remove('away');
}
$('cancelBtn').onclick = closeSheet;
$('scrim').onclick = closeSheet;
$('newText').addEventListener('keydown', function(e){
  if (e.key === 'Enter') $('saveBtn').click();
});

function whenValue(){
  if (addingChores()){
    if (pWhen) return pWhen;
    if (pDays.length) return pDays.join(', ');
    return 'Daily';
  }
  var d = new Date(); d.setHours(12,0,0,0);
  if (pWhen === 'Today')     return iso(d);
  if (pWhen === 'Tomorrow'){ d.setDate(d.getDate()+1); return iso(d); }
  if (pWhen === 'This week'){ d.setDate(d.getDate() + (7 - d.getDay())); return iso(d); }
  if (pWhen === 'Pick…')     return $('newDate').value || '';
  return '';
}
function iso(d){
  return d.getFullYear() + '-' +
    String(d.getMonth()+1).padStart(2,'0') + '-' +
    String(d.getDate()).padStart(2,'0');
}

$('saveBtn').onclick = function(){
  var text = $('newText').value.trim();
  if (!text){ $('newText').focus(); return; }

  var name = pType, when = whenValue();
  var note = addingChores() ? $('newNote').value.trim() : '';

  var idx = -1, list = null;
  for (var i = 0; i < S.lists.length; i++){
    if (S.lists[i].name === name){ idx = i; list = S.lists[i]; }
  }
  if (!list) return;

  closeSheet(); buzz(12);

  // Jump to the tab it landed on, so it's never added invisibly.
  if (idx !== tab){ tab = idx; render(); }

  var temp = { id:'tmp'+Date.now(), text:text, who:pWho || 'Anyone',
               due:'', note:note, state:'none', done:false, sort:when || '9999' };
  list.items.push(temp);
  list.items.sort(function(a,b){
    var r = S.people.indexOf(a.who) - S.people.indexOf(b.who);
    return r || (String(a.sort) < String(b.sort) ? -1 : 1);
  });
  renderMain();

  google.script.run
    .withSuccessHandler(function(res){
      if (res && res.id) temp.id = res.id;
      load();
    })
    .withFailureHandler(function(){
      var k = list.items.indexOf(temp);
      if (k > -1) list.items.splice(k, 1);
      renderMain();
      toast("Couldn't add that. Check your connection.", null, true);
    })
    .addItem(name, text, pWho || '', when, note);
};

/* ── photos ── */
var MAX_EDGE = 2000, QUALITY = 0.82;

$('camBtn').onclick = function(){ $('photoInput').click(); };

$('photoInput').onchange = function(e){
  var files = Array.prototype.slice.call(e.target.files || []);
  e.target.value = '';
  if (files.length) sendPhotos(files);
};

function sendPhotos(files){
  var done = [], failed = 0, n = files.length;
  $('camBtn').classList.add('busy');
  buzz(12);

  var next = function(i){
    if (i >= n){
      $('camBtn').classList.remove('busy');
      status('');
      if (done.length){
        buzz(18);
        var word = done.length === 1 ? 'Photo sent' : done.length + ' photos sent';
        toast(word + (failed ? ' · ' + failed + ' failed' : ''),
              function(){ undoPhotos(done); });
      } else {
        toast("Couldn't send that. Check your connection.", null, true);
      }
      return;
    }
    status(n > 1 ? 'SENDING ' + (i+1) + '/' + n : 'SENDING');

    shrink(files[i]).then(function(b64){
      google.script.run
        .withSuccessHandler(function(res){ if (res && res.id) done.push(res.id); next(i+1); })
        .withFailureHandler(function(){ failed++; next(i+1); })
        .uploadPhoto(b64);
    }).catch(function(){ failed++; next(i+1); });
  };
  next(0);
}

function undoPhotos(ids){
  hideToast(); buzz(10);
  google.script.run
    .withFailureHandler(function(){ toast("Couldn't remove those.", null, true); })
    .trashPhotos(ids);
}

/** Downscale and re-encode. Honours EXIF rotation so portraits stay upright. */
function shrink(file){
  return loadBitmap(file).then(function(bmp){
    var scale = Math.min(1, MAX_EDGE / Math.max(bmp.width, bmp.height));
    var w = Math.round(bmp.width * scale), h = Math.round(bmp.height * scale);
    var c = document.createElement('canvas');
    c.width = w; c.height = h;
    c.getContext('2d').drawImage(bmp, 0, 0, w, h);
    if (bmp.close) bmp.close();
    return c.toDataURL('image/jpeg', QUALITY).split(',')[1];
  });
}

function loadBitmap(file){
  if (window.createImageBitmap){
    return createImageBitmap(file, { imageOrientation:'from-image' })
      .catch(function(){ return viaImg(file); });
  }
  return viaImg(file);
}

function viaImg(file){
  return new Promise(function(res, rej){
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function(){ URL.revokeObjectURL(url); res(img); };
    img.onerror = function(){ URL.revokeObjectURL(url); rej(); };
    img.src ="https://script.google.com/macros/s/AKfycbzsn8rc6BVVxT_A9ZvSNg1QczGswRuujXIeVrJ5MUesp2RIcaJ7huz9ZWFHJeGT7gFu/exec";
  });
}

/* ── snackbar ── */
function toast(msg, action, bad){
  clearTimeout(snackTimer);
  var s = $('snack');
  $('snackText').textContent = msg;
  s.classList.toggle('bad', !!bad);
  $('snackBtn').style.display = action ? '' : 'none';
  $('snackBtn').onclick = action || null;
  s.classList.add('on');
  snackTimer = setTimeout(hideToast, action ? 5000 : 3500);
}
function hideToast(){ $('snack').classList.remove('on'); lastAction = null; }

/* ── pull to refresh ── */
var pullY = 0;
document.addEventListener('touchstart', function(e){
  if (window.scrollY === 0) pullY = e.touches[0].clientY;
}, {passive:true});
document.addEventListener('touchend', function(e){
  if (pullY && window.scrollY === 0 && e.changedTouches[0].clientY - pullY > 90){
    buzz(10); status('REFRESHING'); load();
  }
  pullY = 0;
});
