<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Commerce Boulevard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2320232e'/%3E%3Crect x='2' y='7' width='12' height='2' fill='%23c56f3d'/%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: dark;
    /* Taken from the game's own thirty-two colours, so the chrome and the
       corridor look like they come from the same place. */
    --paper:   #16181f;
    --panel:   #20232e;
    --panel-2: #272b38;
    --line:    #3a3552;
    --ink:     #ecca9f;
    --ink-dim: #c9b193;
    --muted:   #9d978a;
    --faint:   #6f6a63;
    --warn:    #c04539;
    --good:    #8fb063;
    --accent:  #c56f3d;
    --blue:    #5b86bd;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--paper);
    font: 13px/1.5 var(--mono); color: var(--ink-dim); }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  /* The cold open is cold: nothing of the game shows until it is over. */
  body.intro #topbar, body.intro #dock, body.intro #works, body.intro #hint { display: none; }
  body.intro .veil { background: var(--paper); }

  #view { position: fixed; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; cursor: grab; }
  #view.dragging { cursor: grabbing; }

  .panel { background: color-mix(in srgb, var(--panel) 92%, transparent);
    border: 1px solid var(--line); border-radius: 4px; backdrop-filter: blur(6px); }

  /* --- Top bar: the two currencies, always visible --------------------- */
  #topbar { position: fixed; top: 10px; left: 10px; right: 10px; display: flex; gap: 10px;
    align-items: stretch; pointer-events: none; z-index: 5; }
  #topbar > * { pointer-events: auto; }
  .meters { display: flex; gap: 0; padding: 0; overflow: hidden; }
  .meter { padding: 8px 14px; border-right: 1px solid var(--line); min-width: 116px; }
  .meter:last-child { border-right: none; }
  .meter .label { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); }
  .meter .value { font-size: 17px; color: var(--ink); margin-top: 1px; letter-spacing: -0.01em; }
  .meter .sub { font-size: 10px; color: var(--muted); }
  .meter.is-bad .value { color: var(--warn); }
  .meter.is-good .value { color: var(--good); }
  .meter.clickable { cursor: help; }
  .meter.clickable:hover { background: var(--panel-2); }

  .bar { height: 3px; background: var(--line); margin-top: 4px; border-radius: 2px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--accent); }
  .bar.is-low > i { background: var(--warn); }

  #spacer { flex: 1; }
  #sidenote { align-self: flex-start; padding: 8px 12px; max-width: 260px; font-size: 11px;
    color: var(--muted); }
  #sidenote b { color: var(--ink); font-weight: 600; }
  #sidenote .label { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--faint); margin-bottom: 5px; }
  #sidenote .faction { display: grid; grid-template-columns: 1fr auto; column-gap: 10px;
    align-items: baseline; margin-bottom: 4px; }
  #sidenote .faction i { grid-column: 1 / -1; height: 2px; background: var(--line);
    border-radius: 1px; margin-top: 2px; min-width: 1px;
    box-shadow: inset 0 0 0 1px var(--muted); }

  /* --- Bottom: the instruments ----------------------------------------- */
  #dock { position: fixed; left: 10px; right: 10px; bottom: 10px; z-index: 5;
    display: flex; flex-direction: column; transition: transform 0.18s ease; }
  #dock.collapsed { transform: translateY(calc(100% - 31px)); }
  #dock.collapsed #dockbody { pointer-events: none; }
  #tabs { display: flex; gap: 2px; padding: 0 8px; }
  #tabs button { padding: 6px 16px; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-bottom: none;
    border-radius: 4px 4px 0 0; }
  #tabs button[aria-selected="true"] { color: var(--ink); background: var(--panel-2); }
  #tabs button .count { color: var(--faint); margin-left: 6px; }
  #tabs #fold { margin-left: auto; border-radius: 4px 4px 0 0; color: var(--faint); padding: 6px 12px; }
  #tabs #fold:hover { color: var(--ink); }

  /* The dock is a share of the window, not a fixed slab. This is a game about
     looking at a street: on a 1280x720 laptop a fixed 360px dock left 220px of
     street, which is less street than chrome. Rows are fractions of whatever
     height the clamp allows, and below 780px there is only room for one. */
  #dockbody { display: flex; min-height: 0; border-radius: 0 4px 4px 4px;
    height: clamp(180px, 34vh, 320px); }
  #cards { flex: 1; min-width: 0; display: grid; grid-auto-flow: column; grid-auto-columns: 268px;
    grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 8px; padding: 10px;
    overflow-x: auto; overflow-y: hidden; scrollbar-width: thin; }
  @media (max-height: 780px) {
    /* One row, so each card is twice as tall and can show twice the text. */
    #cards { grid-template-rows: minmax(0, 1fr); }
    #cards .card .desc { -webkit-line-clamp: 11; }
    #commitlist { max-height: 999px; }
  }
  @media (max-height: 660px) {
    .meter { padding: 6px 12px; min-width: 104px; }
    .meter .value { font-size: 15px; }
    #sidenote { font-size: 10px; padding: 6px 10px; }
  }
  #cards::-webkit-scrollbar { height: 8px; }
  #cards::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }

  .card { border: 1px solid var(--line); border-radius: 3px; padding: 9px 11px; background: var(--panel);
    scroll-margin: 0;
    display: flex; flex-direction: column; gap: 5px; text-align: left; width: 100%; }
  .card:hover:not(.locked):not(.unaffordable) { border-color: var(--accent); }
  .card .name { color: var(--ink); font-size: 12.5px; line-height: 1.3; }
  .card .desc { color: var(--muted); font-size: 11px; line-height: 1.42; flex: 1; overflow: hidden;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 5; }
  .card .costs { display: flex; gap: 12px; align-items: baseline; font-size: 11.5px; }
  .card .costs .m { color: var(--ink-dim); }
  .card .costs .pc { color: var(--blue); }
  .card .costs .yr { color: var(--faint); }
  .card .costs .short { color: var(--warn); }
  .card .foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .card .why { font-size: 10px; color: var(--faint); border-bottom: 1px dotted var(--faint); }
  .card .why:hover { color: var(--accent); border-color: var(--accent); }
  .card .add { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; padding: 3px 10px;
    border: 1px solid var(--line); border-radius: 3px; color: var(--muted); }
  .card:hover .add { border-color: var(--accent); color: var(--ink); }
  .card.selected { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--panel)); }
  .card.selected .add { border-color: var(--accent); color: var(--accent); }
  .card.locked, .card.unaffordable { opacity: 0.5; cursor: default; }
  .card.locked .desc { color: var(--faint); }
  .card .lock { font-size: 10px; color: var(--faint); font-style: italic; }

  /* --- Commit rail ----------------------------------------------------- */
  #commit { width: 232px; border-left: 1px solid var(--line); padding: 12px; display: flex;
    flex-direction: column; gap: 9px; background: var(--panel-2); border-radius: 0 4px 4px 0; }
  #commit h3 { margin: 0; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); }
  #commitlist { font-size: 11px; color: var(--muted); display: flex; flex-direction: column; gap: 3px;
    max-height: 92px; overflow-y: auto; }
  #commitlist .row { display: flex; justify-content: space-between; gap: 8px; }
  #commitlist .row button { color: var(--faint); font-size: 13px; line-height: 1; }
  #commitlist .row button:hover { color: var(--warn); }
  #commitlist .none { color: var(--faint); font-style: italic; }
  /* What last year would not start. The simulation always knew; nothing said. */
  #commitlist .refused { color: var(--warn); font-size: 10.5px; line-height: 1.4;
    padding-bottom: 6px; margin-bottom: 4px; border-bottom: 1px solid var(--line); }
  #totals { font-size: 11.5px; display: flex; flex-direction: column; gap: 2px; }
  #totals .t { display: flex; justify-content: space-between; }
  #totals .over { color: var(--warn); }
  #advance { margin-top: auto; padding: 11px; border: 1px solid var(--accent); border-radius: 3px;
    color: var(--accent); font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; }
  #advance:hover { background: var(--accent); color: var(--paper); }
  #advance:disabled { opacity: 0.4; cursor: default; border-color: var(--line); color: var(--faint); }

  /* --- Works in progress ------------------------------------------------ */
  #works { position: fixed; right: 10px; top: 136px; width: 244px; z-index: 4; padding: 10px 12px;
    font-size: 11px; }
  #works h3 { margin: 0 0 6px; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); }
  #works .item { margin-bottom: 7px; }
  #works .item .n { color: var(--ink-dim); }
  #works .item .y { color: var(--faint); font-size: 10px; }
  #works .none { color: var(--faint); font-style: italic; }
  #works.hidden { display: none; }

  /* --- Modals ----------------------------------------------------------- */
  .veil { position: fixed; inset: 0; background: rgba(10, 11, 16, 0.86); z-index: 20;
    display: flex; align-items: center; justify-content: center; padding: 24px; }
  .veil.hidden { display: none; }
  .sheet { max-width: 620px; width: 100%; max-height: 84vh; overflow-y: auto; padding: 26px 30px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 5px; }
  .sheet h2 { margin: 0 0 3px; font-size: 15px; color: var(--ink); letter-spacing: 0.02em; }
  .sheet .kicker { font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--faint); margin-bottom: 14px; }
  .sheet p { margin: 0 0 11px; color: var(--ink-dim); line-height: 1.62; }
  .sheet .fine { color: var(--muted); font-size: 11.5px; }
  .sheet dl { display: grid; grid-template-columns: 1fr auto; gap: 3px 16px; margin: 14px 0; font-size: 12.5px; }
  .sheet dt { color: var(--muted); }
  .sheet dd { margin: 0; text-align: right; color: var(--ink-dim); }
  .sheet dl .total { border-top: 1px solid var(--line); padding-top: 7px; margin-top: 5px; color: var(--ink); }
  .sheet .shortfall { font-size: 30px; color: var(--warn); text-align: right; letter-spacing: -0.02em; }
  .actions { display: flex; gap: 10px; margin-top: 20px; }
  .actions button { flex: 1; padding: 12px; border: 1px solid var(--line); border-radius: 3px;
    color: var(--ink-dim); font-size: 12px; }
  .actions button:hover { border-color: var(--accent); color: var(--ink); }
  .actions button.primary { border-color: var(--accent); color: var(--accent); }
  .actions button.primary:hover { background: var(--accent); color: var(--paper); }

  /* --- Why this number -------------------------------------------------- */
  #whysheet .const { border-top: 1px solid var(--line); padding: 12px 0; }
  #whysheet .const:last-child { border-bottom: 1px solid var(--line); }
  #whysheet .const .top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  #whysheet .const .lab { color: var(--ink); }
  #whysheet .const .val { color: var(--accent); white-space: nowrap; }
  #whysheet .const .meta { font-size: 11px; color: var(--faint); margin-top: 3px; }
  #whysheet .const .note { font-size: 11.5px; color: var(--muted); margin-top: 5px; line-height: 1.55; }
  #whysheet .const a { color: var(--blue); }
  .tag { font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase; padding: 1px 6px;
    border: 1px solid var(--line); border-radius: 9px; color: var(--faint); }
  .tag.contested { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 50%, var(--line)); }
  .tag.design { color: var(--blue); border-color: color-mix(in srgb, var(--blue) 40%, var(--line)); }

  /* The hint rides in the dock rather than at a hardcoded offset above it,
     because the dock is no longer one height. Faint text needs a ground under
     it or it disappears into a car park. */
  #hint { position: fixed; left: 10px; z-index: 3; padding: 5px 10px; border-radius: 3px;
    font-size: 10.5px; color: var(--faint); transition: bottom 0.18s ease;
    background: color-mix(in srgb, var(--paper) 78%, transparent); backdrop-filter: blur(4px);
    /* Rides the dock's own clamp: dock body + tabs + the dock's bottom margin. */
    bottom: calc(clamp(180px, 34vh, 320px) + 47px); }
  body.folded #hint { bottom: 48px; }
  #hint b { color: var(--ink-dim); font-weight: 500; }
  body.firstperson #getout { display: none; }

  /* --- The Fairview Ledger ---------------------------------------------- */
  /* Newsprint, printed in one colour on grey stock. Nothing on this page uses
     the game's palette: the paper is a different object, made somewhere else,
     and it should feel like something that landed on the mat. */
  #paper { background: rgba(6, 7, 10, 0.93); align-items: flex-start; padding: 0;
    overflow-y: auto; z-index: 30; }
  #papersheet { --news: #e2ddd0; --newsink: #1c1a1e; --newsfaint: #6a655c;
    background: var(--news); color: var(--newsink); width: 100%; max-width: 940px;
    margin: 24px auto; padding: 26px 34px 30px; border-radius: 2px;
    box-shadow: 0 24px 70px rgba(0, 0, 0, 0.65);
    font: 14px/1.5 Georgia, "Iowan Old Style", "Times New Roman", serif; }

  #papersheet .masthead { text-align: center; margin-bottom: 16px; }
  #papersheet .masthead h1 { margin: 4px 0 2px; font-size: 52px; line-height: 1;
    letter-spacing: -0.015em; font-weight: 700; font-variant: small-caps; }
  #papersheet .rule { height: 2px; background: var(--newsink); }
  #papersheet .rule + h1 + .rule { height: 1px; }
  #papersheet .folio { display: flex; justify-content: space-between; margin-top: 5px;
    font-size: 10.5px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--newsfaint); }

  #papersheet .columns { display: grid; grid-template-columns: 1.55fr 1fr; gap: 0; }
  #papersheet .col { padding: 0 18px; }
  #papersheet .col.lead { border-right: 1px solid rgba(28, 26, 30, 0.28); padding-left: 0; }
  #papersheet .col.side { padding-right: 0; }

  #papersheet article.top h3 { margin: 0 0 6px; font-size: 31px; line-height: 1.08;
    letter-spacing: -0.015em; font-weight: 700; }
  #papersheet article.second h3 { margin: 0 0 4px; font-size: 17px; line-height: 1.18; font-weight: 700; }
  #papersheet article.second { padding-bottom: 12px; margin-bottom: 12px;
    border-bottom: 1px solid rgba(28, 26, 30, 0.22); }
  #papersheet .sub { margin: 0 0 8px; font-size: 14px; font-style: italic; color: #3d3a3f; line-height: 1.4; }
  #papersheet .body { margin: 0; text-align: justify; hyphens: auto; font-size: 13.5px; }
  #papersheet article.top .body::first-letter { float: left; font-size: 44px; line-height: 0.82;
    padding: 4px 6px 0 0; font-weight: 700; }

  #papersheet figure { margin: 16px 0 0; }
  #papersheet figure canvas { width: 100%; height: auto; display: block;
    image-rendering: pixelated; filter: contrast(1.04); }
  #papersheet figcaption { margin-top: 5px; font-size: 11px; line-height: 1.42; color: var(--newsfaint);
    border-bottom: 1px solid rgba(28, 26, 30, 0.22); padding-bottom: 8px; }

  #papersheet h4 { margin: 0 0 6px; font-size: 10.5px; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--newsfaint);
    border-bottom: 2px solid var(--newsink); padding-bottom: 4px; }
  #papersheet .briefs ul { margin: 0; padding: 0; list-style: none; }
  #papersheet .briefs li { font-size: 13px; padding: 5px 0; line-height: 1.32;
    border-bottom: 1px dotted rgba(28, 26, 30, 0.3); }
  #papersheet .letters { margin-top: 18px; padding: 12px 14px; background: rgba(28, 26, 30, 0.055);
    border-top: 2px solid var(--newsink); }
  #papersheet .letters p { margin: 0; font-size: 13px; line-height: 1.55; }
  #papersheet .letters .sig { margin-top: 7px; font-style: italic; color: #46424a; font-size: 12px; }

  #papersheet .fold { display: block; width: 100%; margin-top: 22px; padding: 11px;
    border: 1px solid rgba(28, 26, 30, 0.4); border-radius: 2px; color: #46424a;
    font: 11px/1 var(--mono); letter-spacing: 0.1em; text-transform: uppercase; }
  #papersheet .fold:hover { background: var(--newsink); color: var(--news); }

  /* The one issue where the desk comes round gets the treatment it would
     actually get: a heavier masthead rule and the lead set wider. */
  #paper.turned #papersheet .masthead .rule { height: 4px; }
  #paper.turned #papersheet article.top h3 { font-size: 36px; }

  /* --- The year turning -------------------------------------------------- */
  #season { position: fixed; inset: 0; display: flex; align-items: flex-end; justify-content: center;
    padding-bottom: 7vh; pointer-events: none; z-index: 8; opacity: 0;
    transition: opacity 0.55s ease; }
  #season.on { opacity: 1; }
  #season span { font: 13px/1 var(--mono); letter-spacing: 0.42em; text-transform: uppercase;
    color: var(--ink); text-shadow: 0 2px 20px rgba(0, 0, 0, 0.95), 0 0 40px rgba(0, 0, 0, 0.8); }
  body.advancing #dock, body.advancing #hint { opacity: 0.1; pointer-events: none;
    transition: opacity 0.5s ease; }
  body.advancing #skip { display: block; }
  /* Faint text with no ground behind it vanishes into a corridor full of
     parked cars, and this is the only way out of the year. It gets a panel. */
  #skip { display: none; position: fixed; right: 14px; bottom: 14px; z-index: 9;
    font: 10px/1 var(--mono); letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--ink-dim); padding: 9px 13px; border: 1px solid var(--line); border-radius: 3px;
    background: color-mix(in srgb, var(--panel) 92%, transparent); backdrop-filter: blur(6px); }
  #skip:hover { color: var(--ink); border-color: var(--accent); }
  #skip .key { color: var(--faint); margin-left: 8px; }

  /* --- Getting out of the office -------------------------------------- */
  #fp { position: fixed; inset: 0; z-index: 25; background: #000; display: flex;
    align-items: center; justify-content: center; }
  #fp.hidden { display: none; }
  #fpview { width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; }
  #fphud { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 0;
    align-items: stretch; justify-content: center; pointer-events: none;
    background: linear-gradient(to top, rgba(10,11,16,0.85), transparent); padding: 26px 14px 12px; }
  #fphud .dial { min-width: 108px; text-align: center; padding: 0 14px;
    border-right: 1px solid rgba(255,255,255,0.12); }
  #fphud .dial:last-of-type { border-right: none; }
  #fphud .dial b { display: block; font: 22px/1.1 var(--mono); color: var(--ink);
    letter-spacing: -0.02em; }
  #fphud .dial span { font-size: 9.5px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--muted); }
  #fphud .note { align-self: center; margin-left: 18px; font-size: 11px; color: var(--ink-dim);
    font-style: italic; }
  /* Two lines of faint text, and the top of the windscreen is only one line
     tall - the second used to fall onto the sky. Same fix as the hint bar. */
  #fpkeys { position: fixed; top: 10px; left: 12px; font: 10.5px/1.7 var(--mono);
    color: var(--ink-dim); z-index: 26; padding: 5px 10px; border-radius: 3px;
    background: color-mix(in srgb, var(--paper) 82%, transparent); }
  #fpkeys b { color: var(--muted); font-weight: 500; }
  #fpclose { position: fixed; top: 10px; right: 12px; z-index: 26; padding: 7px 12px;
    font: 10px/1 var(--mono); letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--faint); border: 1px solid var(--line); border-radius: 3px;
    background: rgba(10,11,16,0.6); }
  #fpclose:hover { color: var(--ink); border-color: var(--accent); }
  body.firstperson #topbar, body.firstperson #dock, body.firstperson #works,
  body.firstperson #hint, body.firstperson #skip { display: none; }

  /* Rides the dock's clamp, like the hint. A fixed offset was correct for
     exactly one dock height. */
  #getout { position: fixed; right: 10px; bottom: calc(clamp(180px, 34vh, 320px) + 47px);
    z-index: 4; display: flex; gap: 6px;
    transition: bottom 0.18s ease; }
  body.folded #getout { bottom: 48px; }
  #getout button { padding: 7px 13px; font: 10px/1 var(--mono); letter-spacing: 0.13em;
    text-transform: uppercase; color: var(--ink-dim); border: 1px solid var(--line);
    border-radius: 3px; background: color-mix(in srgb, var(--panel) 92%, transparent); }
  #getout button:hover { color: var(--ink); border-color: var(--accent); }
  body.intro #getout, body.advancing #getout { display: none; }

  /* --- The Ledger View and the reckoning ------------------------------- */
  #ledgerbar { position: fixed; top: 78px; left: 10px; z-index: 6; max-width: 340px;
    padding: 12px 15px; display: none; }
  body.ledger #ledgerbar { display: block; }
  #ledgerbar h4 { margin: 0 0 8px; font-size: 10px; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--faint); }
  #ledgerbar .big { font-size: 22px; color: var(--ink); letter-spacing: -0.02em; }
  #ledgerbar .big span { font-size: 11px; color: var(--muted); letter-spacing: 0; }
  #ledgerbar dl { display: grid; grid-template-columns: 1fr auto; gap: 3px 14px;
    margin: 10px 0 0; font-size: 12px; }
  #ledgerbar dt { color: var(--muted); }
  #ledgerbar dd { margin: 0; text-align: right; color: var(--ink-dim); }
  #ledgerbar .key { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line);
    font-size: 11px; color: var(--muted); line-height: 1.55; }
  #ledgerbar .key b { color: var(--ink-dim); font-weight: 500; }

  /* Block, not flex. `.veil` centres its child, and a flex container that
     centres a child taller than itself pushes the child's top out of the
     scrollable area where nothing can reach it. */
  #reckveil { position: fixed; inset: 0; background: rgba(8, 9, 13, 0.94); z-index: 32;
    display: block; overflow-y: auto; padding: 0; }
  #reckveil.hidden { display: none; }
  #reckoning { max-width: 780px; margin: 40px auto 60px; padding: 32px 38px 40px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 4px; }
  #reckoning h2 { margin: 0 0 22px; font-size: 26px; color: var(--ink); letter-spacing: -0.02em; }
  #reckoning h3 { margin: 30px 0 10px; font-size: 11px; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--accent); }
  #reckoning .kicker { font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--faint); margin-bottom: 12px; }

  /* Two numbers, side by side, and nothing between them but the space. */
  #reckoning .reach { display: grid; grid-template-columns: 1fr 1fr; gap: 1px;
    background: var(--line); border: 1px solid var(--line); border-radius: 3px; margin: 6px 0 4px; }
  #reckoning .reach > div { background: var(--panel-2); padding: 20px 22px; }
  #reckoning .reach b { display: block; font-size: 34px; color: var(--ink);
    letter-spacing: -0.03em; line-height: 1.1; }
  #reckoning .reach span { display: block; margin-top: 6px; font-size: 12px; color: var(--muted);
    line-height: 1.5; }

  table.reck { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.reck thead th { font-size: 9.5px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--faint); font-weight: 400; text-align: right; padding: 0 0 6px 18px;
    white-space: nowrap; }
  table.reck thead th:first-child { text-align: left; padding-left: 0; }
  table.reck tbody th { text-align: left; font-weight: 400; color: var(--ink-dim);
    padding: 7px 12px 7px 0; border-top: 1px solid var(--line); vertical-align: top; }
  table.reck tbody th .note { display: block; font-size: 11px; color: var(--faint);
    margin-top: 2px; line-height: 1.45; }
  table.reck td { text-align: right; padding: 7px 0 7px 16px; border-top: 1px solid var(--line);
    white-space: nowrap; vertical-align: top; font-variant-numeric: tabular-nums; }
  table.reck td.then { color: var(--muted); }
  table.reck td.now { color: var(--ink); }
  table.reck td.total { color: var(--ink-dim); }
  table.reck .unit { font-size: 10px; color: var(--faint); margin-left: 2px; }

  #reckoning ol.vocab { margin: 0; padding: 0; list-style: none; }
  #reckoning ol.vocab li { padding: 7px 0; border-top: 1px solid var(--line);
    font-size: 13px; color: var(--ink-dim); }
  #reckoning ol.vocab b { color: var(--muted); font-weight: 400; margin-right: 12px;
    font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<canvas id="view"></canvas>

<div id="topbar">
  <div class="panel meters" id="meters"></div>
  <div id="spacer"></div>
  <div class="panel" id="sidenote"></div>
</div>

<div class="panel" id="works"></div>

<div id="dock">
  <div id="tabs"></div>
  <div class="panel" id="dockbody">
    <div id="cards"></div>
    <div id="commit">
      <h3>Committing this year</h3>
      <div id="commitlist"></div>
      <div id="totals"></div>
      <button id="advance">Advance a year</button>
    </div>
  </div>
</div>

<div id="hint"></div>

<div class="panel" id="ledgerbar"></div>

<div class="veil hidden" id="reckveil"><div id="reckoning"></div></div>

<div id="getout">
  <button id="godrive">Drive it</button>
  <button id="gowalk">Walk it</button>
  <button id="goledger" hidden>Ledger</button>
</div>

<div id="fp" class="hidden">
  <canvas id="fpview"></canvas>
  <div id="fpkeys"></div>
  <div id="fphud"></div>
  <button id="fpclose">Back to the office</button>
</div>

<div id="season"><span></span></div>
<button id="skip">Skip <span class="key">space</span></button>

<div class="veil hidden" id="paper"><div id="papersheet"></div></div>
<div class="veil hidden" id="modal"><div class="sheet" id="modalsheet"></div></div>
<div class="veil hidden" id="why"><div class="sheet" id="whysheet"></div></div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
