<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Audio probe</title></head>
<body>
<pre id="out">rendering…</pre>
<script type="module">
/*
 * Renders the real synthesiser to actual samples, in a real browser, offline.
 *
 * The stub context test proves the graph is the right shape. This proves it
 * makes a sound, and that the sound is the level the model asked for - which
 * is the only claim the audio makes and the one thing a stub cannot check.
 */
import { advanceYear, newGame } from '/src/sim/index.ts'
import { buildWalkWorld } from '/src/render/walk.ts'
import { buildDriveWorld, newDrive } from '/src/render/drive.ts'
import { cabinMix, kerbMix, officeMix, passEnvelope } from '/src/audio/mix.ts'
import { CorridorSynth } from '/src/audio/synth.ts'

const play = (seed, years, plan = {}) => {
  let s = newGame(seed)
  for (let i = 0; i < years && !s.ended; i++) s = advanceYear(s, plan[s.year] ?? []).state
  return s
}
const CALMED = {
  7: ['capital.road_diet'], 9: ['street.add_kerb_parking'],
  12: ['street.lower_target_speed'], 14: ['street.narrow_lanes'], 17: ['street.plant_trees'],
}

async function render(mix, seconds = 70) {
  const ctx = new OfflineAudioContext(1, 48000 * seconds, 48000)
  const synth = new CorridorSynth(ctx, ctx.destination)
  synth.start()
  synth.setMaster(1, 0.01)
  synth.apply(mix, seconds)
  const buffer = await ctx.startRendering()
  const data = buffer.getChannelData(0)
  let sum = 0
  let peak = 0
  for (let i = 0; i < data.length; i++) {
    sum += data[i] * data[i]
    peak = Math.max(peak, Math.abs(data[i]))
  }
  return { rms: Math.sqrt(sum / data.length), peak }
}

/*
 * Measure the energy in one pass-by envelope relative to peak-squared times
 * duration, so the mix can size a pass to carry exactly the share of the Leq
 * that its lane is responsible for. Measured rather than assumed: the envelope
 * is two exponential ramps and the integral of that is not a round number.
 */
async function envelopeFactor() {
  const seconds = 3
  const ctx = new OfflineAudioContext(1, 48000 * seconds, 48000)
  const src = ctx.createBufferSource()
  const buf = ctx.createBuffer(1, 48000, 48000)
  const d = buf.getChannelData(0)
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1
  src.buffer = buf
  src.loop = true
  const gain = ctx.createGain()
  src.connect(gain)
  gain.connect(ctx.destination)
  const when = 0.2
  const dur = 1.0
  const peak = 0.5
  const SEG = 14
  gain.gain.setValueAtTime(peak * passEnvelope(0), when)
  for (let i = 1; i <= SEG; i++) {
    const t = i / SEG
    gain.gain.linearRampToValueAtTime(Math.max(0.0001, peak * passEnvelope(t)), when + dur * t)
  }
  gain.gain.linearRampToValueAtTime(0.0001, when + dur + 0.03)
  src.start(when)
  src.stop(when + dur + 0.05)
  const rendered = await ctx.startRendering()
  const out = rendered.getChannelData(0)
  let sum = 0
  for (let i = 0; i < out.length; i++) sum += out[i] * out[i]
  // Noise itself has mean square 1/3, so divide it back out.
  return sum / 48000 / (peak * peak * dur) / (1 / 3)
}

const results = {}
try {
  const loud = buildWalkWorld(newGame('a'))
  const quiet = buildWalkWorld(play('a', 22, CALMED))
  const state = play('a', 6)
  const driveWorld = buildDriveWorld(state)

  // Long enough that the events average out: at year zero a vehicle passes
  // the near lane every six seconds, and a four-second window is a coin toss.
  results.kerbYear0 = await render(kerbMix(loud))
  results.kerbCalmed = await render(kerbMix(quiet))
  results.cabin = await render(cabinMix(driveWorld, newDrive(driveWorld)), 20)
  results.office = await render(officeMix(state), 20)
  results.silent = await render({ ...kerbMix(loud), bed: { ...kerbMix(loud).bed, gain: 0, tyreGain: 0, engineGain: 0 }, passes: { ...kerbMix(loud).passes, gain: 0 }, birdsPerMin: 0, leafGain: 0 })
  const loudMix = kerbMix(loud)
  const quietMix = kerbMix(quiet)
  results.levels = {
    kerbYear0Dba: loudMix.bed.dba,
    kerbCalmedDba: quietMix.bed.dba,
    modelDbDrop: loudMix.bed.dba - quietMix.bed.dba,
    renderedDbDrop: 20 * Math.log10(results.kerbYear0.rms / results.kerbCalmed.rms),
    // What the whole emission should be, against what it is.
    year0PassShare: (loudMix.passes.perSecond * loudMix.passes.durationSec
      * loudMix.passes.gain ** 2 * 0.52)
      / (loudMix.bed.gain ** 2 + loudMix.passes.perSecond * loudMix.passes.durationSec
        * loudMix.passes.gain ** 2 * 0.52),
  }
  results.envelopeFactor = await envelopeFactor()
  results.ok = true
} catch (error) {
  results.ok = false
  results.error = String(error && error.stack || error)
}
window.PROBE = results
document.getElementById('out').textContent = JSON.stringify(results, null, 2)
</script>
</body>
</html>
